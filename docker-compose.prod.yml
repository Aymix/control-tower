# Production: Caddy (automatic TLS) -> web (Next.js) ; worker ; Postgres.
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. tower.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tower:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/tower
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tower:${POSTGRES_PASSWORD}@db:5432/tower
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tower
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tower
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tower -d tower"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
  caddy_data:
  caddy_config:
